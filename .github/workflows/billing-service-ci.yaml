name: Billing Service CI

on:
  pull_request:
    branches:
      - main
    paths: &shared_paths
      - "billing-service/**"
      - "contracts/billing-contract/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/billing-service.yaml"

  push:
    branches:
      - main
    paths: *shared_paths

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test Billing Service
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl billing-service \
            -am \
            clean verify

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Billing Service image
        run: |
          docker build \
            --file billing-service/Dockerfile \
            --tag patient-management-system/billing-service:ci \
            .
