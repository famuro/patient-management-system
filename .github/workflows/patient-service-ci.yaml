name: Patient Service CI

on:
  pull_request:
    branches:
      - main
    paths: &shared_paths
      - "patient-service/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".github/workflows/patient-service.yaml"

  push:
    branches:
      - main
    paths: *shared_paths

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: patient-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl patient-service \
            -am \
            clean verify

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Patient Service image
        run: |
          docker build \
            --file patient-service/Dockerfile \
            --tag patient-management-system/patient-service:ci \
            .
