services:
  patient-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: ${PATIENT_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${PATIENT_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - patient-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  patient-service:
    build:
      context: ./patient-service
    image: patient-management-system/patient-service:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patient_db
      SPRING_DATASOURCE_USERNAME: ${PATIENT_POSTGRES_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PATIENT_POSTGRES_PASSWORD}
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_JPA_DDL_AUTO: update
    ports:
      - "4000:4000"
    depends_on:
      patient-db:
        condition: service_healthy

volumes:
  patient-postgres-data:
